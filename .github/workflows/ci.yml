name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install ruff pytest pytest-asyncio
          python -m pip install -r services/agent/requirements.txt
          python -m pip install -r services/mcp_server/requirements.txt
      
      - name: Lint with ruff
        run: ruff check services/ tests/

      - name: Run unit tests
        run: python -m pytest -q tests/unit

  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: 1.21.4
      
      - name: Run OPA tests
        run: opa test policies/rego/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Build MCP Server
        run: docker build -t mcp-server services/mcp_server/
      
      - name: Build Agent Service
        run: docker build -t agent services/agent/
      
      - name: Build Admin UI
        run: docker build -t admin-ui apps/admin-ui/
      
      - name: Build Slack App
        run: docker build -t slack-app services/slack_app/

  integration-test:
    runs-on: ubuntu-latest
    needs: [python-tests, policy-tests, docker-build]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: analyst
          POSTGRES_PASSWORD: analyst_secret
          POSTGRES_DB: analyst_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: 1.21.4
      
      - name: Install test dependencies
        run: |
          python -m pip install pytest pytest-asyncio
          python -m pip install -r services/mcp_server/requirements.txt
      
      - name: Initialize database
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=analyst_secret psql -h localhost -U analyst -d analyst_db -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
      
      - name: Start OPA with policies
        run: |
          nohup opa run --server --addr=127.0.0.1:8181 policies/rego/*.rego > "$RUNNER_TEMP/opa.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8181/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/opa.log"
          exit 1
      
      - name: Run integration tests
        run: python -m pytest -q tests/integration
        env:
          RUN_INTEGRATION: '1'
          DATABASE_URL: postgresql://analyst:analyst_secret@localhost:5432/analyst_db
          OPA_URL: http://127.0.0.1:8181
